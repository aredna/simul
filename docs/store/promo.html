<!doctype html>
<!-- Source of the Chrome Web Store promo tiles. Rendered at 440x280
     (?size=small) and 1400x560 (?size=marquee) with headless Chrome; text
     in Lato. -->
<html lang="en"><head><meta charset="utf-8"><style>
  html, body { margin: 0; }
  body { width: var(--w); height: var(--h); overflow: hidden;
    background: linear-gradient(160deg, #1f8c60 0%, #10553a 100%);
    font-family: Lato, sans-serif; color: #fff;
    display: flex; align-items: center; gap: var(--gap); padding: 0 var(--pad); box-sizing: border-box; }
  svg { width: var(--art); height: var(--art); flex: none; }
  h1 { margin: 0; font-weight: 700; font-size: var(--title); letter-spacing: -0.01em; line-height: 1; }
  p { margin: var(--space) 0 0; font-weight: 400; font-size: var(--tag); line-height: 1.25; color: #dff7ea; max-width: var(--measure); }
  .small { --w: 440px; --h: 280px; --art: 150px; --gap: 22px; --pad: 30px; --title: 46px; --tag: 19px; --space: 12px; --measure: 210px; }
  .marquee { --w: 1400px; --h: 560px; --art: 380px; --gap: 70px; --pad: 120px; --title: 120px; --tag: 44px; --space: 26px; --measure: 780px; }
</style></head>

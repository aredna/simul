name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Use the npm release declared in package.json
        run: corepack enable npm

      # No lockfile is tracked; dependencies resolve within the package.json
      # ranges at install time.
      - name: Install dependencies
        run: npm install

      - name: Verify source and committed Chrome release
        run: npm run check

      - name: Upload verified unpacked extension
        uses: actions/upload-artifact@v7
        with:
          name: simul-chrome-unpacked
          path: dist/chrome-unpacked
          if-no-files-found: error
